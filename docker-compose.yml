version: "3.8"

services:
  murmur:
    build: .
    ports:
      - "${MURMUR_HOST_PORT:-4444}:4444"
    environment:
      - BUS_PORT=4444
      - BUS_DATABASE_URL=postgres://murmur:murmur@db:5432/murmur?sslmode=disable
      - MURMUR_AUTH=${MURMUR_AUTH:-off}
      - MURMUR_ADMIN_KEY=${MURMUR_ADMIN_KEY:-}
      - MURMUR_MEMORY_STORE=${MURMUR_MEMORY_STORE:-postgres}
      - MURMUR_MEMORY_DB=${MURMUR_MEMORY_DB:-/home/nonroot/murmur-memory.db}
      - MURMUR_MEMORY_TTL_DAYS=${MURMUR_MEMORY_TTL_DAYS:-90}
      - MURMUR_MEMORY_KEEP_EXPIRED_DAYS=${MURMUR_MEMORY_KEEP_EXPIRED_DAYS:-30}
      - MURMUR_MEMORY_SCOPE_CAP=${MURMUR_MEMORY_SCOPE_CAP:-1000}
    volumes:
      - murmur-memory-data:/home/nonroot
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: murmur
      POSTGRES_PASSWORD: murmur
      POSTGRES_DB: murmur
    volumes:
      - murmur-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murmur"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  murmur-data:
  murmur-memory-data:
